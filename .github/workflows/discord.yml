name: Discord - Nuevo commit

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notificar a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"🟢 Nuevo commit\",
              \"fields\": [
                {
                  \"name\": \"👤 Usuario\",
                  \"value\": \"$AUTHOR\",
                  \"inline\": true
                },
                {
                  \"name\": \"📁 Proyecto\",
                  \"value\": \"$REPO\",
                  \"inline\": true
                },
                {
                  \"name\": \"🌿 Rama\",
                  \"value\": \"$BRANCH\",
                  \"inline\": true
                },
                {
                  \"name\": \"💬 Mensaje\",
                  \"value\": \"$MESSAGE\"
                }
              ],
              \"url\": \"$COMMIT_URL\"
            }]
          }" \
          "$DISCORD_WEBHOOK"